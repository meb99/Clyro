name: Release

# Ein Tag wie v1.1.0 baut Clyro als Universal-App (Apple Silicon und Intel),
# verpackt sie als DMG und hängt sie an ein GitHub-Release.
on:
  push:
    tags: ['v*']
  # Änderungen am Workflow selbst werden im Pull Request probegebaut (ohne Release).
  pull_request:
    paths: ['.github/workflows/release.yml']
  # Manuell über „Run workflow“ mit einer Versionsnummer: legt Tag und Release selbst an.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne v, z. B. 1.1.0'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build DMG
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version aus dem Tag
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project Clyro.xcodeproj \
            -scheme Clyro \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: DMG erstellen
        run: |
          APP="build/Build/Products/Release/Clyro.app"
          codesign --force --deep --sign - "$APP"
          mkdir -p dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Clyro" -srcfolder dmg -ov -format UDZO "Clyro-${{ steps.version.outputs.version }}.dmg"

      - name: Versionshinweise
        run: |
          NOTES="docs/releases/${{ steps.version.outputs.version }}.md"
          if [[ ! -f "$NOTES" ]]; then
            NOTES="release-notes.md"
            printf '%s\n' "Clyro ${{ steps.version.outputs.version }} für macOS 14 oder neuer (Apple Silicon und Intel)." > "$NOTES"
          fi
          {
            cat "$NOTES"
            printf '\n---\n'
            printf '%s\n' "Die App ist nicht von Apple notarisiert. Beim ersten Start im Programme-Ordner per Rechtsklick auf Clyro → **Öffnen** bestätigen."
          } > release-body.md

      - name: Als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Clyro-${{ steps.version.outputs.version }}
          path: Clyro-*.dmg

      - name: GitHub-Release
        if: github.ref_type == 'tag' || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Clyro ${{ steps.version.outputs.version }}
          files: Clyro-*.dmg
          body_path: release-body.md
          overwrite_files: true
